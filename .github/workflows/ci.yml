name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - name: Test
        run: go test ./... -race -coverprofile=coverage.out
        if: matrix.os != 'windows-latest'
      - name: Test (windows, no race)
        run: go test ./...
        if: matrix.os == 'windows-latest'
      - run: go vet ./...
